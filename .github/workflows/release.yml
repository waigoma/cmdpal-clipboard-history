name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the unsigned package
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the tag and that it is on the release branch
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+$') {
            throw "タグ $env:REF_NAME は vMAJOR.MINOR.PATCH の形式ではありません。"
          }
          git fetch --no-tags origin '+refs/heads/release:refs/remotes/origin/release'
          if ($LASTEXITCODE -ne 0) {
            throw 'origin/release を取得できませんでした。'
          }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/release
          if ($LASTEXITCODE -ne 0) {
            throw 'タグのコミットは origin/release に含まれていません。release ブランチにマージしてからタグを打ってください。'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Run tests
        run: dotnet test tests/ClipboardHistory.Core.Tests -c Release --filter "Category!=Performance"

      - name: Set the package version from the tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:REF_NAME.Substring(1)
          & .\scripts\set-version.ps1 -Version $version
          if ($LASTEXITCODE -ne 0) {
            throw "バージョン $version を設定できませんでした。"
          }

      - name: Build the package
        shell: powershell
        run: scripts\build.ps1

      - name: Stage the release files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'release-stage'
          $unsigned = @(Get-ChildItem -LiteralPath 'artifacts\unsigned' -Filter 'ClipboardHistory_*.msix' -File)
          if ($unsigned.Count -ne 1) {
            throw "artifacts\unsigned に .msix が 1 つだけありません (現在 $($unsigned.Count) 個)。"
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $unsigned[0].FullName -Destination $stage
          Copy-Item -LiteralPath @(
            'scripts\sign-release.ps1',
            'scripts\common.ps1',
            'scripts\install.ps1',
            'LICENSE',
            'THIRD-PARTY-NOTICES.md',
            'licenses\Apache-2.0.txt'
          ) -Destination $stage

      - name: Upload the unsigned files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: release-stage/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign and publish the release
    needs: build
    runs-on: windows-2025
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download the unsigned files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: release

      - name: Sign the package
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = (Resolve-Path -LiteralPath 'release').ProviderPath
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $unsigned = @(Get-ChildItem -LiteralPath $release -Filter 'ClipboardHistory_*.msix' -File)
          if ($unsigned.Count -ne 1) {
            throw "署名対象の .msix が 1 つだけありません (現在 $($unsigned.Count) 個)。"
          }
          & (Join-Path $release 'sign-release.ps1') -Msix $unsigned[0].FullName -OutDir $dist
          if ($LASTEXITCODE -ne 0) {
            throw 'リリース署名に失敗しました。'
          }
          foreach ($name in 'install.ps1', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'Apache-2.0.txt') {
            Copy-Item -LiteralPath (Join-Path $release $name) -Destination $dist
          }

      - name: Write SHA256SUMS.txt
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $lines = foreach ($file in Get-ChildItem -LiteralPath $dist -File | Sort-Object -Property Name) {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name
          }
          [System.IO.File]::WriteAllLines((Join-Path $dist 'SHA256SUMS.txt'), [string[]]@($lines), (New-Object System.Text.UTF8Encoding($false)))

      - name: Create the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $tag = $env:REF_NAME

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "リリース $tag は既に存在します。既存のリリースは変更しません。"
          }

          $msix = Get-ChildItem -LiteralPath $dist -Filter 'ClipboardHistory_*.msix' -File | Select-Object -First 1
          $thumbprint = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 (Join-Path $dist 'waigoma.cer')).Thumbprint
          $notesPath = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          $notes = @"
          ClipboardHistory $tag

          ## 導入方法

          1. $($msix.Name), waigoma.cer, install.ps1 の 3 つを同じフォルダーに保存します。
          2. SHA256SUMS.txt の値と各ファイルのハッシュを照合します。
          3. 管理者として PowerShell を開き、次のコマンドで証明書を登録します (パスは保存先に合わせてください)。
             Import-Certificate -FilePath "<保存先>\waigoma.cer" -CertStoreLocation Cert:\LocalMachine\TrustedPeople
          4. 同じフォルダーで次のコマンドを実行します。
             powershell -ExecutionPolicy Bypass -File .\install.ps1
          5. CmdPal を再起動します。

          ## 署名証明書

          - 指紋 (SHA-1): $thumbprint
          - この証明書は自己署名で、認証局による証明ではありません。手順 3 を実行すると、この PC で waigoma 名義の署名を信頼することになります。信頼したくない場合は、リポジトリのソースからビルドしてください。
          "@
          [System.IO.File]::WriteAllText($notesPath, $notes, (New-Object System.Text.UTF8Encoding($false)))

          $assets = @(Get-ChildItem -LiteralPath $dist -File | ForEach-Object { $_.FullName })
          gh release create $tag --verify-tag --title "ClipboardHistory $tag" --notes-file $notesPath @assets
          if ($LASTEXITCODE -ne 0) {
            throw "リリース $tag の作成に失敗しました。"
          }
